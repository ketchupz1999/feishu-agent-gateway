name: CI
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: mkdir -p releases && npm pack --pack-destination releases
      - run: node scripts/check-package.mjs releases/feishu-agent-gateway-2.0.0-alpha.1.tgz
